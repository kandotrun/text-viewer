<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="入力した文章を大きな文字で読み、編集できるビューア。">
    <title>読むだけ</title>
    <link rel="stylesheet" href="./viewer.css">
    <script src="./viewer.js" defer></script>
  </head>
  <body>
    <main>
      <textarea id="text" aria-label="文章" placeholder="ここに入力・貼り付け" dir="auto" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="share" id="share" hidden>
        <input id="share-link" aria-label="共有リンク" type="text" readonly hidden>
        <span id="share-status" role="status"></span>
        <button id="copy-link" type="button">リンクをコピー</button>
      </div>
    </main>
  </body>
</html>
